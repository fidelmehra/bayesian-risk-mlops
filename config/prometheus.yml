# Prometheus scrape configuration for Bayesian Risk-MLOps
# Author: Fidel Mehra

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: bayesian-risk-mlops

scrape_configs:
  - job_name: bayesian_risk_api
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
